name: CI

on:
  push:
    branches: [master, feat/add-backend]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: cd client && npm ci --cache /tmp/npm-cache-ci
      - name: Lint design-token rules
        run: cd client && npm run lint:css:strict-value
      - name: Run CSS regression tests
        run: cd client && npm run test:css
