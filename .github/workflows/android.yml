name: Android APK

# 云端出包：验证（类型 / 样式守卫 / 测试）通过后构建 debug APK。
# 产物在 Actions 运行页的 Artifacts 里下载，直接装到手机上。

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'client/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 样式守卫 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（含 postinstall 构建补丁）
        run: npm ci

      - name: TypeScript 检查
        run: npm run typecheck --workspace client

      - name: stylelint 严格值守卫（禁止硬编码颜色/字号/间距/圆角）
        run: npm run lint --workspace client

      - name: 单元与静态扫描测试
        run: npm test --workspace client

  apk:
    name: 构建 debug APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK（compileSdk 36）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 构建 H5 产物并同步进安卓工程
        run: npm run build:android --workspace client

      - name: Gradle assembleDebug
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WabiSabiSalary-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
